<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    background: #000;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.scene {
    position: relative;
    width: 360px;
    height: 360px;
}
/* 🖕 Emoji */
.emoji {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 180px;
    line-height: 1;
    filter:
        drop-shadow(0 0 8px #c77dff)
        drop-shadow(0 0 18px #c77dff)
        drop-shadow(0 0 30px #9b5de5);
    animation: pulse 1.8s ease-in-out infinite alternate;
}
@keyframes pulse {
    from {
        transform: translate(-50%, -50%) scale(0.95);
        filter:
            drop-shadow(0 0 8px #c77dff)
            drop-shadow(0 0 18px #c77dff)
            drop-shadow(0 0 30px #9b5de5);
    }
    to {
        transform: translate(-50%, -50%) scale(1.08);
        filter:
            drop-shadow(0 0 12px #00f5d4)
            drop-shadow(0 0 25px #00f5d4)
            drop-shadow(0 0 40px #00bbf9);
    }
}
/* Connecting lines */
.line {
    stroke: #c77dff;
    stroke-width: 2;
    fill: none;
    filter:
        drop-shadow(0 0 5px #c77dff)
        drop-shadow(0 0 10px #9b5de5);
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawLine 0.12s linear forwards;
}
@keyframes drawLine {
    to {
        stroke-dashoffset: 0;
    }
}
/* Dots */
.dot {
    fill: #00f5d4;
    filter:
        drop-shadow(0 0 6px #00f5d4)
        drop-shadow(0 0 12px #00bbf9);
    opacity: 0;
    animation: appear 0.18s ease forwards;
}
@keyframes appear {
    0% {
        opacity: 0;
        r: 0;
    }
    70% {
        opacity: 1;
        r: 4;
    }
    100% {
        opacity: 1;
        r: 3;
    }
}
/* Center message */
.message {
    position: absolute;
    left: 50%;
    top: 105%;
    transform: translateX(-50%);
    color: #c77dff;
    font-family: Arial, sans-serif;
    font-size: 24px;
    white-space: nowrap;
    opacity: 0;
    animation: message 1s ease forwards;
    animation-delay: 7s;
    text-shadow: 0 0 10px #9b5de5;
}
@keyframes message {
    to {
        opacity: 1;
    }
}
</style>
</head>
<body>
<div class="scene">
    <div class="emoji">🖕</div>
    <svg id="heart" viewBox="0 0 360 360"></svg>
    <div class="message">
        🖕 CAREER LUNCHER 🖕
    </div>
</div>
<script>
const svg = document.getElementById("heart");

/* =================================
   CIRCLE POINTS (around the emoji)
================================= */
const points = [];
const total = 120;
const radius = 140;
for (let i = 0; i <= total; i++) {
    const t = (Math.PI * 2 * i) / total;
    let x = 180 + radius * Math.cos(t);
    let y = 180 + radius * Math.sin(t);
    points.push({ x, y });
}

/* =================================
   CONNECT DOTS ONE BY ONE
================================= */
for (let i = 0; i < points.length - 1; i++) {
    const p1 = points[i];
    const p2 = points[i + 1];

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", p1.x);
    line.setAttribute("y1", p1.y);
    line.setAttribute("x2", p2.x);
    line.setAttribute("y2", p2.y);
    line.classList.add("line");
    line.style.animationDelay = (i * 0.055) + "s";
    svg.appendChild(line);

    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("cx", p1.x);
    dot.setAttribute("cy", p1.y);
    dot.setAttribute("r", "3");
    dot.classList.add("dot");
    dot.style.animationDelay = (i * 0.055) + "s";
    svg.appendChild(dot);
}

/* =================================
   LAST DOT
================================= */
const last = points[points.length - 1];
const lastDot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
lastDot.setAttribute("cx", last.x);
lastDot.setAttribute("cy", last.y);
lastDot.setAttribute("r", "3");
lastDot.classList.add("dot");
lastDot.style.animationDelay = ((points.length - 1) * 0.055) + "s";
svg.appendChild(lastDot);
</script>
</body>
</html>
