<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎂 Birthday Celebration</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#080014;color:#fff;overflow:hidden}.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#5d147d 0,#17052b 45%,#050008 100%)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;background:#000}.overlay{position:relative;z-index:2;text-align:center;padding:28px;max-width:900px}.badge{display:inline-block;padding:8px 14px;border:1px solid #ffffff55;border-radius:999px;background:#ffffff12;backdrop-filter:blur(8px);font-size:14px}.title{font-size:clamp(42px,8vw,92px);margin:18px 0 8px;line-height:1.05}.sub{font-size:clamp(18px,3vw,30px);opacity:.9}.btn{margin-top:28px;border:0;border-radius:999px;padding:15px 24px;font-size:18px;font-weight:700;cursor:pointer;background:#fff;color:#351047}.hidden{display:none}.error{color:#ffd4d4;margin-top:16px;font-size:14px}
</style></head>
<body><main class="stage">
<video id="player" playsinline preload="auto" controls></video>
<section id="welcome" class="overlay"><div class="badge">A special birthday surprise 🎁</div><h1 class="title">Happy Birthday! 🎂</h1><p class="sub">Your celebration is ready.</p><button class="btn" id="start">▶ Start Celebration</button><div id="error" class="error"></div></section>
</main>
<script>
const params=new URLSearchParams(location.search);
const name=params.get('name')||'Birthday Star';
const media=params.get('media')||'birthday.mp4';
document.querySelector('.title').textContent=`Happy Birthday, ${name}! 🎂`;
const player=document.getElementById('player'); const welcome=document.getElementById('welcome'); const error=document.getElementById('error');
player.src=media;
document.getElementById('start').onclick=async()=>{welcome.classList.add('hidden');player.style.display='block';try{await player.play()}catch(e){error.textContent='Video play nahi hua. Screen par Play dabayein.';player.controls=true;welcome.classList.remove('hidden')}};
player.addEventListener('error',()=>{error.textContent=`Media file nahi mili: ${media}`;});
</script></body></html>
